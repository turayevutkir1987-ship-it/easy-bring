<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBring AI - Aqlli Yetkazib Berish</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #0088cc;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .section-title {
      font-weight: bold;
      color: #333;
      margin-top: 15px;
      margin-bottom: 8px;
      font-size: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #fff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0088cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #006699;
    }
    #result {
      margin-top: 15px;
      padding: 12px;
      background: #eef9ff;
      border-left: 4px solid #0088cc;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚚 EasyBring AI</h2>
    
    <!-- QAYERDAN (OLISH) -->
    <div class="section-title">📍 Qayerdan (Olish):</div>
    <div class="row">
      <select id="pickupRegion" onchange="updateDistricts('pickupRegion', 'pickupDistrict')">
        <option value="">Viloyatni tanlang</option>
        <option value="Toshkent shahri">Toshkent shahri</option>
        <option value="Toshkent viloyati">Toshkent viloyati</option>
        <option value="Navoiy">Navoiy viloyati</option>
        <option value="Samarqand">Samarqand viloyati</option>
        <option value="Buxoro">Buxoro viloyati</option>
        <option value="Andijon">Andijon viloyati</option>
        <option value="Farg'ona">Farg'ona viloyati</option>
        <option value="Namangan">Namangan viloyati</option>
      </select>

      <select id="pickupDistrict">
        <option value="">Tuman tanlang</option>
      </select>
    </div>

    <!-- QAYERGA (TOPSHIRISH) -->
    <div class="section-title">🏁 Qayerga (Topshirish):</div>
    <div class="row">
      <select id="dropoffRegion" onchange="updateDistricts('dropoffRegion', 'dropoffDistrict')">
        <option value="">Viloyatni tanlang</option>
        <option value="Toshkent shahri">Toshkent shahri</option>
        <option value="Toshkent viloyati">Toshkent viloyati</option>
        <option value="Navoiy">Navoiy viloyati</option>
        <option value="Samarqand">Samarqand viloyati</option>
        <option value="Buxoro">Buxoro viloyati</option>
        <option value="Andijon">Andijon viloyati</option>
        <option value="Farg'ona">Farg'ona viloyati</option>
        <option value="Namangan">Namangan viloyati</option>
      </select>

      <select id="dropoffDistrict">
        <option value="">Tuman tanlang</option>
      </select>
    </div>

    <!-- YUK NOMI -->
    <div class="section-title">📦 Yuk nomi:</div>
    <input type="text" id="item" placeholder="Masalan: Hujjat, Noutbuk, Kiyim...">

    <button onclick="sendOrder()">Hisoblash</button>

    <div id="result"></div>
  </div>

  <!-- JAVASCRIPT MANTIQLARI -->
  <script>
    // Viloyat va tumanlar ma'lumotlar bazasi
    const districtsData = {
      "Toshkent shahri": ["Chilonzor", "Yunusobod", "Mirzo Ulug'bek", "Yakkasaroy", "Mirobod", "Olmazor", "Sergeli"],
      "Toshkent viloyati": ["Zangiota", "Qibray", "Chirchiq", "Olmaliq", "Angren", "Yangiyo'l"],
      "Navoiy": ["Navoiy shahri", "Karmana", "Qiziltepa", "Xatirchi", "Zarafshon"],
      "Samarqand": ["Samarqand shahri", "Pastdarg'om", "Toyloq", "Jomboy", "Kattaqo'rg'on"],
      "Buxoro": ["Buxoro shahri", "G'ijduvon", "Kogon", "Romitan"],
      "Andijon": ["Andijon shahri", "Asaka", "Shahrixon", "Xo'jaobod"],
      "Farg'ona": ["Farg'ona shahri", "Marg'ilon", "Qo'qon", "Oltiariq"],
      "Namangan": ["Namangan shahri", "Chust", "Pop", "Kosonsoy"]
    };

    // Viloyat tanlanganda tumanlarni yangilash
    function updateDistricts(regionId, districtId) {
      const regionSelect = document.getElementById(regionId);
      const districtSelect = document.getElementById(districtId);
      const selectedRegion = regionSelect.value;

      districtSelect.innerHTML = '<option value="">Tuman tanlang</option>';

      if (selectedRegion && districtsData[selectedRegion]) {
        districtsData[selectedRegion].forEach(district => {
          const option = document.createElement('option');
          option.value = district;
          option.textContent = district;
          districtSelect.appendChild(option);
        });
      }
    }

    // Hisoblash tugmasi bosilganda ishlovchi funksiya
    function sendOrder() {
      const pRegion = document.getElementById('pickupRegion').value;
      const pDistrict = document.getElementById('pickupDistrict').value;
      
      const dRegion = document.getElementById('dropoffRegion').value;
      const dDistrict = document.getElementById('dropoffDistrict').value;
      
      const item = document.getElementById('item').value;
      const resultDiv = document.getElementById('result');

      // Maydonlar to'liq tanlanganini tekshirish
      if (!pRegion || !pDistrict || !dRegion || !dDistrict || !item) {
        alert("Iltimos, barcha maydonlarni tanlang va yuk nomini kiriting!");
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = "⏳ <i>AI marshrut va narxni hisoblamoqda...</i>";

      const pickupLocation = `${pRegion}, ${pDistrict}`;
      const dropoffLocation = `${dRegion}, ${dDistrict}`;

      // AI natijasini shakllantirish (Demo ko'rinishida)
      setTimeout(() => {
        const distance = Math.floor(Math.random() * 8) + 4;
        const price = distance * 3500 + 8000;
        const time = distance * 4;

        resultDiv.innerHTML = `
          <h3 style="margin-top:0; color:#0088cc;">📦 AI Natijasi:</h3>
          <p><b>📍 Qayerdan:</b> ${pickupLocation}</p>
          <p><b>🏁 Qayerga:</b> ${dropoffLocation}</p>
          <p><b>📦 Yuk:</b> ${item}</p>
          <hr style="border:0.5px solid #ddd;">
          <p>📏 <b>Masofa:</b> ~${distance} km</p>
          <p>💰 <b>Tavsiya narx:</b> ${price.toLocaleString('uz-UZ')} so'm</p>
          <p>⏱ <b>Vaqt:</b> ~${time} daqiqa</p>
          <p>💡 <b>AI Maslahat:</b> Yo'nalish bo'yicha eng ma'qul marshrut tanlandi, kuryerlar tez topiladi.</p>
        `;
      }, 1000);
    }
  </script>
</body>
</html>
