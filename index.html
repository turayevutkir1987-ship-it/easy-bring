<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBring Shop - Onlayn Do'kon</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #0088cc;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .cart-box {
      background: #f9f9f9;
      border: 1px dashed #0088cc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .cart-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
    }
    .cart-total {
      font-weight: bold;
      color: #0088cc;
      border-top: 1px solid #ddd;
      padding-top: 8px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
    }
    .section-title {
      font-weight: bold;
      color: #333;
      margin-top: 15px;
      margin-bottom: 8px;
      font-size: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #fff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #218838;
    }
    #result {
      margin-top: 15px;
      padding: 12px;
      background: #eef9ff;
      border-left: 4px solid #0088cc;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🛍 EasyBring Shop</h2>
    
    <!-- KARZINKA BO'LIMI -->
    <div class="cart-box">
      <div class="cart-title">
        <span>🛒 Sizning Karzinkangiz</span>
        <span style="font-size: 12px; color: #888;">(3 ta mahsulot)</span>
      </div>
      <div class="cart-item">
        <span>1. Noutbuk (ASUS)</span>
        <b>8 500 000 so'm</b>
      </div>
      <div class="cart-item">
        <span>2. Sichqoncha (Wireless)</span>
        <b>150 000 so'm</b>
      </div>
      <div class="cart-item">
        <span>3. Sumka</span>
        <b>250 000 so'm</b>
      </div>
      <div class="cart-total">
        <span>Mahsulotlar summasi:</span>
        <span id="productTotal">8 900 000 so'm</span>
      </div>
    </div>

    <!-- RASMIYLASHTIRISH BO'LIMI -->
    <div class="section-title">📍 Yetkazib berish manzilini kiriting:</div>
    <div class="row">
      <select id="pickupRegion" onchange="updateDistricts('pickupRegion', 'pickupDistrict')">
        <option value="">Viloyatni tanlang</option>
        <option value="Toshkent shahri">Toshkent shahri</option>
        <option value="Navoiy">Navoiy viloyati</option>
        <option value="Samarqand">Samarqand viloyati</option>
        <option value="Buxoro">Buxoro viloyati</option>
        <option value="Andijon">Andijon viloyati</option>
      </select>

      <select id="pickupDistrict">
        <option value="">Tuman tanlang</option>
      </select>
    </div>

    <div class="section-title">🏠 Aniq manzil (Ko'cha, uy/xonadon):</div>
    <input type="text" id="streetAddress" placeholder="Masalan: Navoiy sh., Amir Temur ko'chasi 12-uy">

    <div class="section-title">📞 Telefon raqamingiz:</div>
    <input type="text" id="phone" placeholder="+998 90 123 45 67">

    <button onclick="processCheckout()">Buyurtmani rasmiylashtirish</button>

    <div id="result"></div>
  </div>

  <!-- JAVASCRIPT MANTIQLARI -->
  <script>
    const districtsData = {
      "Toshkent shahri": ["Chilonzor", "Yunusobod", "Mirzo Ulug'bek", "Yakkasaroy", "Mirobod"],
      "Navoiy": ["Navoiy shahri", "Karmana", "Qiziltepa", "Xatirchi", "Zarafshon"],
      "Samarqand": ["Samarqand shahri", "Pastdarg'om", "Toyloq", "Jomboy"],
      "Buxoro": ["Buxoro shahri", "G'ijduvon", "Kogon"],
      "Andijon": ["Andijon shahri", "Asaka", "Shahrixon"]
    };

    function updateDistricts(regionId, districtId) {
      const regionSelect = document.getElementById(regionId);
      const districtSelect = document.getElementById(districtId);
      const selectedRegion = regionSelect.value;

      districtSelect.innerHTML = '<option value="">Tuman tanlang</option>';

      if (selectedRegion && districtsData[selectedRegion]) {
        districtsData[selectedRegion].forEach(district => {
          const option = document.createElement('option');
          option.value = district;
          option.textContent = district;
          districtSelect.appendChild(option);
        });
      }
    }

    function processCheckout() {
      const region = document.getElementById('pickupRegion').value;
      const district = document.getElementById('pickupDistrict').value;
      const address = document.getElementById('streetAddress').value;
      const phone = document.getElementById('phone').value;
      const resultDiv = document.getElementById('result');

      if (!region || !district || !address || !phone) {
        alert("Iltimos, manzil va telefon raqamingizni to'liq kiriting!");
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = "⏳ <i>AI yetkazib berish narxi va marshrutni hisoblamoqda...</i>";

      setTimeout(() => {
        const productPrice = 8900000;
        const deliveryFee = Math.floor(Math.random() * 15000) + 20000; // 20k - 35k so'm
        const grandTotal = productPrice + deliveryFee;
        const estimatedTime = Math.floor(Math.random() * 20) + 25; // 25-45 daqiqa

        resultDiv.innerHTML = `
          <h3 style="margin-top:0; color:#28a745;">✅ Buyurtma qabul qilindi!</h3>
          <p><b>📍 Manzil:</b> ${region}, ${district}, ${address}</p>
          <p><b>📞 Aloqa:</b> ${phone}</p>
          <hr style="border:0.5px solid #ddd;">
          <p>🛍 <b>Mahsulotlar:</b> ${productPrice.toLocaleString('uz-UZ')} so'm</p>
          <p>🚚 <b>AI Kuryer xizmati:</b> ${deliveryFee.toLocaleString('uz-UZ')} so'm</p>
          <p style="font-size:16px; font-weight:bold; color:#0088cc;">💳 Jami to'lov: ${grandTotal.toLocaleString('uz-UZ')} so'm</p>
          <p>⏱ <b>Yetkazish vaqti:</b> ~${estimatedTime} daqiqa</p>
          <p>💡 <b>AI Maslahat:</b> Mahsulot sinuvchan (noutbuk). Kuryer maxsus himoya sumkasida yetkazib beradi.</p>
        `;
      }, 1200);
    }
  </script>
</body>
</html>
